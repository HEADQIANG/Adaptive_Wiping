output_dir: runs/sim_training/pretrain_wide_2000_v1
simulation:
  base_mount: tabletop
  base_xy: [0.07, 0.0]
  tool_mount: direct_wrist_v3
  ft_frame_profile: kwr52_left_v1
  inertia_profile: discoverse_standard
  tool_inertia_profile: uniform_box_v1
  target_velocity_feedforward: true
  timestep: 0.002
  sample_hz: 100
  duration: 4.0
  press_speed: 0.005
  slide_speed: 0.05
  exploration_ramp_s: 0.2
  start_xy: [0.31, 0.0]
  initial_gap: 0.001
  table_offset: [0.15, 0.0, 0.9]
  gain_candidates: [2000, 5000, 10000]
  torque_limits: [10, 10, 10, 5, 5, 5]
  position_rms_limit: 0.001
  orientation_limit_degrees: 1.0
  seed: 42
randomization:
  friction: [0.0, 1.2]
  stiffness_direct: [10.0, 10000.0]
  width: [0.001, 1.2]
  gain: [2000.0, 10000.0]
collection:
  motion_gate: false
  sampling: latin_hypercube_mu_uniform_others_log
  workers: 4
dataset:
  train: 1600
  validation: 200
  test: 200
filter:
  order: 2
  cutoff_hz: 10.0
training:
  epochs: 1000
  checkpoint_every: 200
  batch_size: 32
  learning_rate: 0.0001
  beta: 0.06
  seed: 42
  device: cpu
  threads: 1
